<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#0b0a10;--surf:#15131d;--gold:#e0b552;--dim:#8a8398;--txt:#ece8f1;--line:#2a2438;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding:18px 14px 56px;line-height:1.45;max-width:440px;margin:0 auto}
h1{font-size:1.4rem;color:var(--gold);font-weight:800}
.sub{color:var(--dim);font-size:12px;margin:6px 0 12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--gold);color:#111;font-size:14px}
button.sec{background:#1c1826;color:var(--txt);border:1px solid var(--line)}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;background:#0e0c14;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;margin:6px 0;font-size:14px}
.bar{height:10px;background:#1c1826;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff3);width:0;transition:width .25s}
.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#1c1826;font-size:11px;color:var(--dim);margin:2px}
.chip b{color:var(--gold)}
.cine{min-height:132px;text-align:center}
.cine-door{font-size:28px;font-weight:800;letter-spacing:.04em;padding:18px 0;min-height:68px}
.cine-door.gold{color:#fbbf24;text-shadow:0 0 18px #fbbf2466}
.cine-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.relic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.relic{background:#0e0c14;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;opacity:.38}
.relic.on{opacity:1;border-color:#fbbf2444}
.relic b{display:block;font-size:10px;margin-top:4px;font-weight:700}
.relic-art{width:100%;height:56px;border-radius:8px;margin:0 auto;position:relative;overflow:hidden;background:#1c1826}
.relic-art.ember{background:radial-gradient(circle at 50% 80%,#fb923c,transparent 55%),linear-gradient(180deg,#7c2d12,#1c1917)}
.relic-art.seed{background:radial-gradient(circle at 50% 40%,#c4b5fd,transparent 50%),linear-gradient(180deg,#4c1d95,#1c1826)}
.relic-art.coin{background:radial-gradient(circle at 50% 50%,#67e8f9 0 28%,transparent 30%),linear-gradient(180deg,#164e63,#0e0c14)}
.relic-art.shard{background:linear-gradient(135deg,transparent 40%,#fbbf24 41% 46%,transparent 47%),linear-gradient(180deg,#78350f,#1c1826)}
.relic-art.wick{background:radial-gradient(circle at 50% 20%,#fde68a,transparent 28%),linear-gradient(180deg,#14532d,#0e0c14)}
.relic-art.hinge{background:repeating-linear-gradient(90deg,#334155 0 6px,#1e293b 6px 12px)}
.relic-art.thread{background:repeating-linear-gradient(120deg,#818cf8 0 2px,transparent 2px 8px),#111827}
.relic-art.glass{background:linear-gradient(180deg,#22d3ee55,#0e7490 70%)}
.daily-out .drow{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.daily-out button.tick{width:100%;text-align:left}
.daily-out button.tick.on{border-color:var(--gold);color:var(--gold)}
.dstrip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.dseg{display:block;text-align:center;font-size:11px;padding:6px 0;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:#0e0c14}
.dseg.on{border-color:var(--gold);color:var(--gold);background:#1c1826}
.yest-out{margin-top:4px;opacity:.88}
.yest-out .dstrip{margin:4px 0 2px}
.yest-out .dseg{font-size:10px;padding:4px 0}
#resetCount{margin:4px 0 2px;color:var(--gold);font-variant-numeric:tabular-nums}
#firstTick{margin:2px 0 0;color:var(--gold)}
#firstTickAt{margin:2px 0 4px;color:var(--gold);font-variant-numeric:tabular-nums}
#yestFirstTickAt{margin:2px 0 4px;color:var(--gold);font-variant-numeric:tabular-nums}
#yestFirstTickAt.dim{color:var(--dim);opacity:.55}
.dseg.first,.daily-out button.tick.first{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
@media (prefers-reduced-motion:reduce){.cine-door{text-shadow:none}}
#out{font-size:13px;margin-top:8px;white-space:pre-wrap}
a{color:var(--gold)}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:22px;line-height:1.6}

</style></head><body>
